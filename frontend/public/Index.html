<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tareas</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <header class=" app-header">
            <h1>Mis tareas</h1>
            <p class="subtitle">Organiza tu día</p>
        </header>

        <form id="todo-form" class="todo-form">
            <div class="form-group">
                <input type="text" id="todo-title" placeholder="¿Qué necesitas hacer?" required>
                <input type="text" id="todo-desc" placeholder="Descripción" >
            </div>
            <button type="submit" class="btn-add">Agregar</button>
        </form>

        <div class="filters">
            <button class="filter-btn active" data-filter="all">Todas</button>
            <button class="filter-btn" data-filter="active">Activas</button>
            <button class="filter-btn" data-filter="completed">Completadas</button>
        </div>

        <ul id="todo-list" class="todo-list"></ul>
        
        <footer class="app-footer">
            <span id="todo-count">0 tareas</span>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
